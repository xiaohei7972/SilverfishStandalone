name: Classic Silverfish compile (diagnostic)

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Choose older reference diagnostics or the owner's pinned source archive"
        required: true
        type: choice
        options:
          - old-reference-diagnostic
          - owner-2026-11-05-release
          - owner-classic-work-package
        default: old-reference-diagnostic
      release_tag:
        description: "Release tag for owner's ZIP (owner release mode)"
        required: false
        type: string
        default: classic-source-2026-11-05
      release_asset:
        description: "Release ZIP asset filename (owner release mode)"
        required: false
        type: string
        default: ClassicSilverfish_2026-11-05_独立源码工作包.zip
  push:
    branches:
      - "feat/**"
    paths:
      - ".github/workflows/classic-compile.yml"
      - "tools/import_classic.py"
      - "tools/disable_aggramar.py"
      - "tools/normalize_classic.py"
      - "tools/package_reference_classic.py"
      - "src/Silverfish.Classic/**"
      - "src/Silverfish.Classic.Smoke/**"
      - "tests/Silverfish.ClassicBridge.Tests/**"
      - "tests/Silverfish.ClassicModelAdapter.Tests/**"
      - "src/Silverfish.ClassicModelAdapter/**"
      - "src/Silverfish.Domain/**"
      - "samples/classic-*.txt"
      - "samples/classic-*.json"
      - "tools/test_normalize_classic.py"


permissions:
  contents: read

jobs:
  compile:
    name: Build headless classic Silverfish
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Checkout SilverfishStandalone
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Checkout older reference (NOT owner's final baseline)
        if: github.event_name == 'push' || inputs.source_mode == 'old-reference-diagnostic'
        uses: actions/checkout@v4
        with:
          repository: xiaohei7972/Hearthbuddy_backed
          ref: main
          path: .reference-source
          fetch-depth: 1

      - name: Package older reference as temporary ZIP
        if: github.event_name == 'push' || inputs.source_mode == 'old-reference-diagnostic'
        shell: pwsh
        run: |
          python tools/package_reference_classic.py .reference-source "$env:RUNNER_TEMP/classic-source.zip"

      - name: Download owner archive from this repo's release assets
        if: github.event_name == 'workflow_dispatch' && (inputs.source_mode == 'owner-2026-11-05-release' || inputs.source_mode == 'owner-classic-work-package')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ASSET: ${{ inputs.release_asset }}
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "$env:RELEASE_ASSET" --dir "$env:RUNNER_TEMP" --clobber
          $source = Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET
          if (-not (Test-Path -LiteralPath $source)) { throw "Release asset not found" }
          Move-Item -LiteralPath $source -Destination "$env:RUNNER_TEMP/classic-source.zip" -Force

      - name: Import owner archive with mandatory SHA-256 pinning
        if: github.event_name == 'workflow_dispatch' && inputs.source_mode == 'owner-2026-11-05-release'
        shell: pwsh
        run: |
          python tools/import_classic.py "$env:RUNNER_TEMP/classic-source.zip" --dest . --sha256 1879f784ed5b6854d53e148fc444d0f65bd8afbd52ccc1b3d8cf56e23efb5071

      - name: Verify and stage owner's source-only classic work package
        if: github.event_name == 'workflow_dispatch' && inputs.source_mode == 'owner-classic-work-package'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/classic-source.zip"
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $accepted = @(
            "ec1ff768036deee5ebda81274f6e1a61a69c105b0b6cd37b285c2d8dd34f771c"
            "81f6f19e2888ba5158ea194d6bea30d1f2ad90a7e67e7fd8565ffc7d2bff75e7"
            "4d6944304c0d224d366afda1691f0429c5d3cffbc0daae18259310a7f6f95d92"
          )
          if ($sha -notin $accepted) {
            throw "Classic source-only work package SHA-256 mismatch: $sha"
          }
          $staging = Join-Path $env:RUNNER_TEMP "verified-classic-package"
          Expand-Archive -LiteralPath $archive -DestinationPath $staging -Force
          $imported = Join-Path $staging "src/Silverfish.Classic/Imported"
          $manifest = Join-Path $staging "classic-import-manifest.json"
          if (-not (Test-Path (Join-Path $imported "ai/Ai.cs"))) { throw "Imported classic Ai.cs missing from pinned work package" }
          if (-not (Test-Path -LiteralPath $manifest)) { throw "Source manifest missing" }
          $baseline = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($baseline.sha256 -ne "1879f784ed5b6854d53e148fc444d0f65bd8afbd52ccc1b3d8cf56e23efb5071") {
            throw "Imported classic source manifest does not match the owner's November 5 baseline"
          }
          New-Item -ItemType Directory -Force -Path "src/Silverfish.Classic/Imported" | Out-Null
          Copy-Item -Path (Join-Path $imported "*") -Destination "src/Silverfish.Classic/Imported" -Recurse -Force
          Copy-Item -LiteralPath $manifest -Destination "classic-import-manifest.json" -Force
          Write-Host "Verified owner's 2026-11-05 source-only work package."

      - name: Import older reference for compiler diagnostics
        if: github.event_name == 'push' || inputs.source_mode == 'old-reference-diagnostic'
        shell: pwsh
        run: |
          python tools/import_classic.py "$env:RUNNER_TEMP/classic-source.zip" --dest .

      - name: Normalize host-free classic AI references for any source mode
        shell: pwsh
        run: python tools/normalize_classic.py

      - name: Disable four problematic Aggramar effects (reversible comments)
        shell: pwsh
        run: |
          python tools/disable_aggramar.py
          Get-Content classic-import-manifest.json | Select-Object -First 35

      - name: Print source provenance and verify classic source exists
        shell: pwsh
        run: |
          Get-Content classic-import-manifest.json
          if (-not (Test-Path "src/Silverfish.Classic/Imported/ai/Ai.cs")) { throw "Missing classic Ai.cs" }

      - name: Compile imported classic AI (collect full diagnostics)
        shell: pwsh
        run: |
          dotnet build src/Silverfish.Classic/Silverfish.Classic.csproj -c Release --nologo -v:normal -flp:"logfile=classic-build.log;verbosity=normal" *> classic-console.log
          $code = $LASTEXITCODE
          Get-Content classic-console.log -Tail 100
          exit $code

      - name: Run classic CardDB smoke if build succeeds
        shell: pwsh
        run: |
          dotnet run --project src/Silverfish.Classic.Smoke/Silverfish.Classic.Smoke.csproj -c Release *> classic-smoke.log
          $code = $LASTEXITCODE
          Get-Content classic-smoke.log -Tail 60
          exit $code

      - name: Test classic bestmove-to-legal-action bridge
        shell: pwsh
        run: |
          dotnet test tests/Silverfish.ClassicBridge.Tests/Silverfish.ClassicBridge.Tests.csproj -c Release --nologo

      - name: Test old-to-new Minion Handcard Weapon state projection (legacy refactor experiment)
        if: github.event_name == 'push' || inputs.source_mode == 'old-reference-diagnostic'
        shell: pwsh
        run: |
          dotnet test tests/Silverfish.ClassicModelAdapter.Tests/Silverfish.ClassicModelAdapter.Tests.csproj -c Release --nologo

      - name: Run classic AI autoTester against a fixed offline board
        shell: pwsh
        run: |
          dotnet run --project src/Silverfish.Classic.Smoke/Silverfish.Classic.Smoke.csproj -c Release -- samples/classic-simple-lethal-zh.txt *> classic-board-test.log
          $code = $LASTEXITCODE
          Get-Content classic-board-test.log -Tail 80
          exit $code

      - name: Run classic Silverfish from versioned JSON GameSnapshot
        shell: pwsh
        run: |
          dotnet run --project src/Silverfish.Classic.Smoke/Silverfish.Classic.Smoke.csproj -c Release -- samples/classic-snapshot-lethal.json *> classic-snapshot-test.log
          $code = $LASTEXITCODE
          Get-Content classic-snapshot-test.log -Tail 80
          exit $code

      - name: Verify malformed BoardTester input fails visibly
        shell: pwsh
        run: |
          # An invalid board MUST make the child process fail. Suppress only
          # PowerShell's automatic native-command failure behavior while we
          # capture its exit code; keep strict checks on the assertion itself.
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          dotnet run --project src/Silverfish.Classic.Smoke/Silverfish.Classic.Smoke.csproj -c Release -- samples/classic-invalid-zh.txt *> classic-invalid-test.log
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Get-Content classic-invalid-test.log -Tail 30
          if ($code -eq 0) { throw "Invalid board returned success, expected a nonzero exit" }
          if (-not (Select-String -Path classic-invalid-test.log -Pattern "Invalid classic (BoardTester|offline board) input" -Quiet)) {
            throw "Invalid board did not emit the expected standalone input error"
          }
          Write-Host "PASS: invalid classic board produced a nonzero exit and an explanatory FormatException."
          exit 0

      - name: Upload import manifest and compile logs, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classic-silverfish-build-logs
          path: |
            classic-import-manifest.json
            classic-headless-patches.json
            classic-build.log
            classic-console.log
            classic-smoke.log
            classic-board-test.log
            classic-snapshot-test.log
            classic-invalid-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload independently compiled classic Silverfish
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: classic-silverfish-net8
          path: |
            src/Silverfish.Classic/bin/Release/net8.0/**
            src/Silverfish.Classic.Smoke/bin/Release/net8.0/**
          if-no-files-found: error
          retention-days: 14
