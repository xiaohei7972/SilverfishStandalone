name: Classic Silverfish compile (diagnostic)

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Choose older reference diagnostics or the owner's pinned source archive"
        required: true
        type: choice
        options:
          - old-reference-diagnostic
          - owner-2026-11-05-release
        default: old-reference-diagnostic
      release_tag:
        description: "Release tag for owner's ZIP (owner release mode)"
        required: false
        type: string
        default: classic-source-2026-11-05
      release_asset:
        description: "Release ZIP asset filename (owner release mode)"
        required: false
        type: string
        default: Hearthbuddy1.7.1(1).zip
  push:
    branches:
      - "feat/**"
    paths:
      - ".github/workflows/classic-compile.yml"
      - "tools/import_classic.py"
      - "tools/package_reference_classic.py"
      - "src/Silverfish.Classic/**"
      - "src/Silverfish.Classic.Smoke/**"

permissions:
  contents: read

jobs:
  compile:
    name: Build headless classic Silverfish
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SilverfishStandalone
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Checkout older reference (NOT owner's final baseline)
        if: github.event_name == 'push' || inputs.source_mode == 'old-reference-diagnostic'
        uses: actions/checkout@v4
        with:
          repository: xiaohei7972/Hearthbuddy_backed
          ref: main
          path: .reference-source
          fetch-depth: 1

      - name: Package older reference as temporary ZIP
        if: github.event_name == 'push' || inputs.source_mode == 'old-reference-diagnostic'
        shell: pwsh
        run: |
          python tools/package_reference_classic.py .reference-source "$env:RUNNER_TEMP/classic-source.zip"

      - name: Download owner archive from this repo's release assets
        if: github.event_name == 'workflow_dispatch' && inputs.source_mode == 'owner-2026-11-05-release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ASSET: ${{ inputs.release_asset }}
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern "$env:RELEASE_ASSET" --dir "$env:RUNNER_TEMP" --clobber
          $source = Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET
          if (-not (Test-Path -LiteralPath $source)) { throw "Release asset not found" }
          Move-Item -LiteralPath $source -Destination "$env:RUNNER_TEMP/classic-source.zip" -Force

      - name: Import owner archive with mandatory SHA-256 pinning
        if: github.event_name == 'workflow_dispatch' && inputs.source_mode == 'owner-2026-11-05-release'
        shell: pwsh
        run: |
          python tools/import_classic.py "$env:RUNNER_TEMP/classic-source.zip" --dest . --sha256 1879f784ed5b6854d53e148fc444d0f65bd8afbd52ccc1b3d8cf56e23efb5071

      - name: Import older reference for compiler diagnostics
        if: github.event_name == 'push' || inputs.source_mode == 'old-reference-diagnostic'
        shell: pwsh
        run: |
          python tools/import_classic.py "$env:RUNNER_TEMP/classic-source.zip" --dest .

      - name: Print source provenance and verify classic source exists
        shell: pwsh
        run: |
          Get-Content classic-import-manifest.json
          if (-not (Test-Path "src/Silverfish.Classic/Imported/ai/Ai.cs")) { throw "Missing classic Ai.cs" }

      - name: Compile imported classic AI (collect full diagnostics)
        shell: pwsh
        run: |
          dotnet build src/Silverfish.Classic/Silverfish.Classic.csproj -c Release --nologo -v:normal -flp:"logfile=classic-build.log;verbosity=normal" *> classic-console.log
          $code = $LASTEXITCODE
          Get-Content classic-console.log -Tail 100
          exit $code

      - name: Run classic CardDB smoke if build succeeds
        shell: pwsh
        run: |
          dotnet run --project src/Silverfish.Classic.Smoke/Silverfish.Classic.Smoke.csproj -c Release --nologo *> classic-smoke.log
          $code = $LASTEXITCODE
          Get-Content classic-smoke.log -Tail 60
          exit $code

      - name: Upload import manifest and compile logs, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classic-silverfish-build-logs
          path: |
            classic-import-manifest.json
            classic-build.log
            classic-console.log
            classic-smoke.log
          if-no-files-found: warn
          retention-days: 14
