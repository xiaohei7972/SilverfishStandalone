name: Build and offline tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate classic import tool
        run: python tools/test_import_classic.py
      - name: Validate headless classic source patching
        run: python tools/test_normalize_classic.py
      - name: Unit tests
        run: dotnet test tests/Silverfish.Tests/Silverfish.Tests.csproj -c Release --nologo
      - name: Immutable AI model regression tests
        run: dotnet test tests/Silverfish.Domain.Tests/Silverfish.Domain.Tests.csproj -c Release --nologo
      - name: Offline sample
        run: dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- samples/lethal.json
      - name: Replay a combat in the new simulator
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-combat.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $hero = $replay.entities | Where-Object { $_.id.value -eq 10 }
          if ($hero.character.health -ne 28 -or $replay.steps[2].events[-2].kind -ne 'deathrattle') {
              throw 'Unexpected combat replay result.'
          }
      - name: Replay spell timing and death position
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-triggers.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $timing = $replay.steps[0].events | Where-Object { $_.kind -eq 'triggered' } | ForEach-Object { $_.timing }
          $board = $replay.players[0].zones.play.value -join ','
          if (($timing -join ',') -ne 'beforeSpellResolved,minionDied,afterSpellResolved' -or $board -ne '10,11,21,13') {
              throw 'Unexpected trigger or board order.'
          }
      - name: Replay starter cards with damage and draw triggers
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-damage-draw.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $hero = $replay.entities | Where-Object { $_.id.value -eq 10 }
          $attack = $replay.steps[2].events.kind -join ','
          $draws = ($replay.steps.events | Where-Object { $_.kind -eq 'cardDrawn' }).source.value -join ','
          if ($hero.character.armor -ne 1 -or $draws -ne '14,15,22,16' -or
              $attack -ne 'attack,damage,damage,triggered,cardDrawn,triggered,armorGained') {
              throw 'Unexpected damage-and-draw replay.'
          }
      - name: Replay stat enchantments and auras
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-stats.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $wisp = $replay.entities | Where-Object { $_.id.value -eq 11 }
          $hero = $replay.entities | Where-Object { $_.id.value -eq 20 }
          $endTurn = $replay.steps[3].events.kind -join ','
          if ($hero.character.health -ne 25 -or $wisp.character.attack -ne 2 -or
              $wisp.character.baseAttack -ne 1 -or $wisp.auraGrants.source.value -ne 12 -or
              $wisp.enchantments.Count -ne 0 -or
              $endTurn -ne 'turnEnded,enchantmentExpired,enchantmentExpired,turnStarted,cardDrawn') {
              throw 'Unexpected stat enchantment or aura replay result.'
          }
      - name: Replay equipment and hero powers
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-equipment.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $hero = $replay.entities | Where-Object { $_.id.value -eq 10 }
          $weaponId = $replay.players[0].equippedWeapon.value
          $weapon = $replay.entities | Where-Object { $_.id.value -eq $weaponId }
          $attack = $replay.steps[0].events.kind -join ','
          $ready = $replay.legalActions | Where-Object { $_.kind -eq 'attack' -and $_.source.value -eq 10 -and $_.target.value -eq 20 }
          if ($hero.character.health -ne 26 -or $weapon.cardId -ne 'CS2_082' -or $weapon.weapon.durability -ne 2 -or
              $replay.players[0].heroPowerUsesThisTurn -ne 0 -or !$ready -or
              $attack -ne 'attack,damage,damage,weaponDurabilityLost,weaponDestroyed,died,deathrattle,damage,died') {
              throw 'Unexpected equipment or hero power replay.'
          }
      - name: Replay return, transform, and resurrection
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-lifecycle.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $replayed = $replay.entities | Where-Object { $_.id.value -eq 11 }
          $sheep = $replay.entities | Where-Object { $_.id.value -eq 21 }
          $resurrection = $replay.steps[4].events | Where-Object { $_.kind -eq 'resurrected' }
          if ($replay.players[0].mana -ne 0 -or $replayed.character.health -ne 2 -or $replayed.costModifiers.Count -ne 0 -or
              $sheep.cardId -ne 'CS2_tk1' -or $sheep.playOrder -ne 5 -or $replay.minionDeaths.Count -ne 1 -or
              $replay.minionDeaths[0].entity.value -ne 15 -or $resurrection.source.value -ne 15 -or $resurrection.target.value -ne 22) {
              throw 'Unexpected return, transform, or resurrection replay.'
          }
      - name: Replay combat keywords and overload
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-combat-keywords.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $hero = $replay.entities | Where-Object { $_.id.value -eq 10 }
          $enemyHero = $replay.entities | Where-Object { $_.id.value -eq 20 }
          $weapon = $replay.entities | Where-Object { $_.id.value -eq 11 }
          $player = $replay.players[0]
          $heroAttack = $replay.legalActions | Where-Object { $_.kind -eq 'attack' -and $_.source.value -eq 10 }
          if ($heroAttack -or !$hero.character.frozen -or $hero.character.health -ne 27 -or $enemyHero.character.health -ne 26 -or
              $weapon.weapon.durability -ne 6 -or $player.mana -ne 8 -or $player.overloadLocked -ne 2 -or
              $player.overloadOwed -ne 0 -or $replay.minionDeaths[0].entity.value -ne 21) {
              throw 'Unexpected combat keyword or overload replay.'
          }
      - name: Replay secrets, counters, and attack cancellation
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-secrets.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $hero = $replay.entities | Where-Object { $_.id.value -eq 10 }
          $wisp = $replay.entities | Where-Object { $_.id.value -eq 11 }
          $armed = ($replay.steps.events | Where-Object { $_.kind -eq 'secretArmed' }).source.value -join ','
          $counter = $replay.steps[4].events.kind -join ','
          $attack = $replay.steps[5].events.kind -join ','
          if ($armed -ne '21,22,23' -or $replay.players[1].zones.secret.Count -ne 0 -or
              $hero.character.health -ne 28 -or $wisp.costModifiers.delta -ne 2 -or $replay.players[0].overloadOwed -ne 0 -or
              $counter -ne 'cardPlayed,secretRevealed,spellCountered' -or
              $attack -ne 'attack,secretRevealed,returnedToHand,secretRevealed,damage,attackCancelled') {
              throw 'Unexpected counter or trap order.'
          }
      - name: Replay and plan random effects
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- plan samples/simulation-random.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $companion = $replay.entities | Where-Object { $_.id.value -eq 23 }
          if ($companion.cardId -ne 'NEW1_033' -or $replay.plan.outcome -ne 'inProgress' -or
              $replay.plan.winProbability -ne 0.875 -or $replay.plan.usesSamples -or
              !$replay.plan.replanAfterLastAction -or $replay.plan.actions.Count -ne 1 -or
              $replay.plan.actions[0].source.value -ne 12 -or $replay.plan.transitions -gt 512) {
              throw 'Unexpected seeded summon or random outcome plan.'
          }
      - name: Replay mana and player choices
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- simulate samples/simulation-mana.json --card-data src/Silverfish.Simulation/Data/StarterCardData.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $player = $replay.players[0]
          $nourish = $replay.steps[1].events | Where-Object { $_.kind -eq 'manaRefreshed' }
          $excess = $replay.steps[2].events | Where-Object { $_.kind -eq 'cardGenerated' }
          $bloom = $replay.steps[4].events.kind -join ','
          if ($replay.cardDataBuild -ne 256589 -or $player.mana -ne 8 -or $player.manaCrystals -ne 10 -or $player.manaSpent -ne 0 -or
              $player.temporaryMana -ne 0 -or $player.overloadLocked -ne 2 -or $player.overloadOwed -ne 0 -or
              $nourish.amount -ne 2 -or $excess.target.value -ne 22 -or
              $replay.steps[3].events[-1].source.value -ne 15 -or $bloom -ne 'cardPlayed,overloadScheduled,manaRefreshed') {
              throw 'Unexpected mana, choice, or generated card result.'
          }
      - name: Libmem.NET integration build (Windows x64)
        run: dotnet build src/Silverfish.Integrations.Libmem/Silverfish.Integrations.Libmem.csproj -c Release --nologo
      - name: Replay and plan targeted card choices
        shell: pwsh
        run: |
          $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- plan samples/simulation-choices.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replay = ($json -join "`n") | ConvertFrom-Json
          $summon = $replay.steps[0].events | Where-Object { $_.kind -eq 'summoned' }
          $strike = $replay.plan.actions[0]
          if ($replay.steps[0].action.choice -ne 'deploy' -or $summon.source.value -ne 21 -or
              $replay.plan.winProbability -ne 1 -or $replay.plan.actions.Count -ne 1 -or
              $strike.choice -ne 'strike' -or $strike.source.value -ne 12 -or $strike.target.value -ne 20) {
              throw 'Unexpected targeted choice replay or plan.'
          }
      - name: Replay and plan with catalog-backed custom rules
        shell: pwsh
        run: |
          $catalog = [System.IO.Path]::GetTempFileName()
          try {
              $import = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- import-card-data samples/card-data-demo.xml $catalog
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if (($import -join "`n") -notmatch '已将构建 1 的 1 条卡牌资料导出') {
                  throw '导入命令未显示预期的中文提示。'
              }
              $json = dotnet run --project src/Silverfish.Cli/Silverfish.Cli.csproj -c Release -- plan samples/simulation-card-data.json --card-data $catalog
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $replay = ($json -join "`n") | ConvertFrom-Json
              $hero = $replay.entities | Where-Object { $_.id.value -eq 10 }
              $weapon = $replay.entities | Where-Object { $_.id.value -eq 11 }
              $attack = $replay.plan.actions[0]
              if ($replay.cardDataBuild -ne 1 -or $replay.players[0].mana -ne 0 -or $hero.character.armor -ne 2 -or
                  $weapon.weapon.durability -ne 2 -or $replay.plan.winProbability -ne 1 -or
                  $attack.kind -ne 'attack' -or $attack.source.value -ne 10 -or $attack.target.value -ne 20) {
                  throw '挂载外置卡牌资料后，回放或搜索结果与预期不符。'
              }
          } finally {
              Remove-Item -LiteralPath $catalog
          }
